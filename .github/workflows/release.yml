name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # setup-node ships npm 10.x with Node 22; OIDC trusted publishing needs
      # 11.5.1+. Stay on the 11.x line — npm 12 requires a newer Node than this job runs.
      - run: npm install -g npm@^11.6.1
      - run: npm ci
      # Re-run the full gate so a tag can never publish something CI would reject.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Fail early if the tag (vX.Y.Z) and package.json version disagree.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
      # No NODE_AUTH_TOKEN: auth is npm trusted publishing (OIDC), bound to this
      # repository and this workflow file. There is no npm token anywhere in the repo.
      - run: npm publish --provenance --access public
