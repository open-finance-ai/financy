# LAMBDA_HOSTNAME is set per environment via `wrangler secret put LAMBDA_HOSTNAME`.

name = "financy-mcp-proxy-staging"
main = "src/index.js"
compatibility_date = "2026-08-17"
workers_dev = false

[[routes]]
pattern = "mcp-stg.open-finance.ai"
custom_domain = true

[env.production]
name = "financy-mcp-proxy-prod"

[[env.production.routes]]
pattern = "mcp.open-finance.ai"
custom_domain = true
